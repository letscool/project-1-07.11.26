<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анкета — Секретный DeepSeek API</title>
</head>
<body>
    <h1>Анкета новичка</h1>
    <p>
        <a href="index.html">Главная</a> |
        <a href="form.html">Записаться</a>
    </p>
    <hr>

    <form action="thanks.html" method="get">
        <fieldset>
            <legend>О тебе</legend>

            <p><label for="nick">Имя *</label><br>
            <input id="nick" name="nick" required maxlength="20"></p>

            <p><label for="age">Возраст</label><br>
            <input id="age" type="number" name="age" min="7" max="99"></p>

            <p><label for="email">Почта</label><br>
            <input id="email" type="email" name="email"></p>

            <p>Пол<br>
            <label><input type="radio" name="gender" value="male"> Мужской</label>
            <label><input type="radio" name="gender" value="female"> Женский</label></p>

            <p><label for="birthday">Дата рождения</label><br>
            <input id="birthday" type="date" name="birthday"></p>

            <p><label for="interest">Интересы</label><br>
            <input id="interest" name="interest"></p>

            <p>Пользуешься ли ПИКАЧУ ВПН?<br>
            <label><input type="radio" name="vpn" value="yes"> Да</label>
            <label><input type="radio" name="vpn" value="no"> Нет</label></p>
        </fieldset>

        <fieldset>
            <legend>Что навайбкодить</legend>

            <p>Выбери проект<br>
            <label><input type="radio" name="project" value="calculator"> Калькулятор</label>
            <label><input type="radio" name="project" value="vpn"> VPN</label>
            <label><input type="radio" name="project" value="game"> Игру</label></p>

            <p><label for="date">Когда удобно</label><br>
            <input id="date" type="date" name="date"></p>

            <p><label for="prompt">Твой промпт</label><br>
            <textarea id="prompt" name="prompt" rows="4" cols="40"></textarea></p>

            <p><label for="file">Прикрепи скриншот или файл</label><br>
            <input id="file" type="file" name="file"></p>
        </fieldset>

        <p><button type="submit">Отправить заявку</button></p>
    </form>
</body>
</html>
